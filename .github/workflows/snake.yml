name: Generate Contribution Snake

on:
  schedule:
    # Runs once a day at 00:00 UTC (~5:30 AM IST). Cron uses UTC always.
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main               # regenerate whenever you push to main

permissions:
  contents: write           # required so the workflow can push the generated SVGs

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation
        uses: Platane/snk@v3
        id: snake-gen
        with:
          github_user_name: mwarandekar-zoro
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#0D1117,#1E3A8A,#3B82F6,#8B5CF6,#22D3EE
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#38BDF8&color_dots=#0D1117,#1E3A8A,#3B82F6,#8B5CF6,#22D3EE

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
